apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
spec:
  # Backup the database every day at 2AM
  schedule: "0 0 * * 6"
  jobTemplate:
    spec:
      template:
        spec:
          nodeName: icrs0
          containers:
          - name: postgres-backup
            image: postgres:alpine
            command: ['/bin/bash']
            args: ['-c', 'pg_dump -U $USER -h $POSTGRES_HOSTNAME -p $PORT -d $POSTGRES_DATABASE -f /var/backups/backup-$(date +"%m-%d-%Y-%H-%M").sql ']
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret 
                  key: password
            - name: POSTGRES_HOSTNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_hostname
            - name: PORT
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: port
            - name: POSTGRES_DATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres_database
            - name: USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: user
            volumeMounts:
            - mountPath: /var/backups
              name: postgres-storage
          restartPolicy: Never
          volumes:
          - name: postgres-storage
            hostPath:
            # Ensure the file directory is created.
              path: /var/volumes/postgres-backups
              type: DirectoryOrCreate
