# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  db:
    image: postgres:17
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/src/discord_database.sql:/docker-entrypoint-initdb.d/00001.sql
      - ./postgres/src/lab_database.sql:/docker-entrypoint-initdb.d/00002.sql
      - ./postgres/src/meme_database.sql:/docker-entrypoint-initdb.d/00003.sql
      - ./postgres/test/project_schema.sql:/docker-entrypoint-initdb.d/00004.sql
      - ./postgres/test/test_example_data.sql:/docker-entrypoint-initdb.d/00010.sql
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    expose:
      - 5432
    healthcheck:
      test: [ "CMD", "pg_isready" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  db-data:

